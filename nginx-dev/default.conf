 

limit_req_zone $binary_remote_addr zone=mylimit:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 5M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_comp_level 5;

    # OpenAPI JSON (точное совпадение) - должно быть ДО location /
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API Swagger документация
    location /api/swagger {
        proxy_pass http://backend:8000/api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API ReDoc документация
    location /api/redoc {
        proxy_pass http://backend:8000/api/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    ## API Openapi Schema
    #location /api/openapi.json {
    #    proxy_pass http://backend:8000/api/openapi.json;
    #    proxy_http_version 1.1;
    #    proxy_set_header Host $host;
    #}

    # API запросы
    location /api/ {
        limit_req zone=mylimit burst=5;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фронтенд (React) - ДОЛЖЕН БЫТЬ ПОСЛЕДНИМ
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}
