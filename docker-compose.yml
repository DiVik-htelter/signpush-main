version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: signpush_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_NAME:-signpush}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/full_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - signpush-net

  redis:
    image: redis:alpine
    container_name: signpush_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - signpush-net

  backend:
    build: ./backend
    container_name: signpush_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-1234}@db:5432/${DB_NAME:-signpush}
      REDIS_URL: redis://redis:6379/0
    networks:
      - signpush-net

  nginx:
    build: 
      context: .
      dockerfile: ./nginx-dev/Dockerfile
    container_name: signpush_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-dev/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - signpush-net

volumes:
  postgres_data:
  redis_data:

networks:
  signpush-net:
    driver: bridge